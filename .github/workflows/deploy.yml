name: Publicar site

on:
  push:
    branches: [claude/mvp-professional-site-cwj7p0]
  workflow_dispatch:
  # As datas dos leilões de demonstração são relativas ao momento do build.
  # A reconstrução diária mantém os prazos do catálogo sempre válidos.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos, lint e testes
        run: |
          npm run typecheck
          npm run lint
          npm test

      # O GitHub Pages serve o projeto em /<nome-do-repositório>.
      - name: Gerar o site estático
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Publica o resultado no branch gh-pages, de onde o Pages serve o site.
      # `.nojekyll` impede que o GitHub processe a saída com o Jekyll.
      - name: Publicar no branch gh-pages
        run: |
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica o site (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
