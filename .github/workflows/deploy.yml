name: Publicar site

on:
  push:
    branches: [claude/mvp-professional-site-cwj7p0]
  workflow_dispatch:
  # As datas dos leilões de demonstração são relativas ao momento do build.
  # A reconstrução diária mantém os prazos do catálogo sempre válidos.
  schedule:
    - cron: "0 6 * * *"

# Publicação oficial do GitHub Pages: o build vira um artefato e a ação
# deploy-pages o publica. Requer Settings > Pages > Source = "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos, lint e testes
        run: |
          npm run typecheck
          npm run lint
          npm test

      # Informa o endereço e o caminho base em que o Pages serve o site
      # (/<repositório>, ou a raiz quando há domínio próprio).
      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Gerar o site estático
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      # `.nojekyll` impede que o Pages ignore as pastas que começam com "_".
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
